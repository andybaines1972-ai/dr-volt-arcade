<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dr. Volt Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one arcade cabinet (lit marquee, CRT screen, control deck) standing on a dark arcade floor. Single dark look by design. */
:root{
  --floor:#0b0a14; --cab:#1b1830; --cab-edge:#342e5e; --screen:#000;
  --volt:#35e0ff; --bolt:#ffe14a; --gold:#ffc83d; --hot:#ff3d8b;
  --ink:#e9ecff; --dim:#9a96c4;
  --font-arcade:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;
  --font-body:'VT323',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;box-sizing:border-box;background:var(--floor);color:var(--ink);
  font-family:var(--font-body);font-size:20px;line-height:1.2;
  display:flex;justify-content:center;align-items:flex-start;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.cab{width:min(100%,1320px,138vh);background:var(--cab);border:3px solid var(--cab-edge);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.marquee{padding:10px 12px 9px;text-align:center;background:linear-gradient(#2c1f78,#130e36);border-bottom:3px solid var(--cab-edge);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:baseline}
.marquee h1{margin:0;font-family:var(--font-arcade);font-weight:400;font-size:clamp(14px,2.6vw,26px);letter-spacing:.04em;color:var(--bolt);text-shadow:.12em .12em 0 var(--hot),0 0 18px rgba(255,225,74,.45)}
.marquee p{margin:0;font-family:var(--font-arcade);font-size:clamp(8px,1.3vw,12px);letter-spacing:.12em;color:var(--gold)}
.bezel{background:#07060d;padding:clamp(6px,1.4vw,16px)}
.screen{position:relative;border-radius:10px;overflow:hidden;background:var(--screen)}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--screen);outline:none;touch-action:none}
canvas:focus-visible{outline:2px solid var(--volt);outline-offset:-2px}
.scan{position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 3px,rgba(0,0,0,.13) 3px 4px),
  radial-gradient(ellipse at center,rgba(0,0,0,0) 66%,rgba(0,0,0,.42))}
.deck{display:flex;flex-direction:column;gap:12px;padding:12px 14px;border-top:3px solid var(--cab-edge)}
.pad{display:none;justify-content:space-between;gap:10px}
.pad div{display:flex;gap:10px}
.b{font-family:var(--font-arcade);font-size:9px;width:58px;height:58px;border-radius:50%;border:3px solid var(--cab-edge);background:#262148;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.b.zap{background:var(--bolt);color:#1a1530;border-color:#a8900f}
.b.jump{background:var(--volt);color:#06202a;border-color:#128aa3}
.b.storm{background:var(--hot);color:#fff;border-color:#a3134d}
.b:focus-visible,.s:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.keys{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;color:var(--dim)}
.keys div{display:flex;gap:8px;align-items:baseline}
.keys dt{color:var(--ink);border:2px solid var(--cab-edge);border-radius:5px;padding:0 6px;background:#262148}
.keys dd{margin:0}
.s{font-family:var(--font-arcade);font-size:9px;padding:9px 10px;border-radius:6px;border:2px solid var(--cab-edge);background:#262148;color:var(--ink);cursor:pointer}
.guide{color:var(--dim)}
.guide summary{font-family:var(--font-arcade);font-size:9px;color:var(--ink);cursor:pointer;padding:6px 0;letter-spacing:.06em}
.guide summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.guide-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 26px;margin-top:8px}
.guide h3{margin:0 0 6px;font-family:var(--font-arcade);font-size:10px;font-weight:400;letter-spacing:.06em}
.guide ul{margin:0;padding-left:18px}
.guide li{margin:2px 0}
.guide b{color:var(--gold);font-weight:400}
@media (pointer:coarse){.pad{display:flex}}
</style>

<main class="cab">
  <header class="marquee">
    <h1>DR. VOLT</h1>
    <p>&amp; THE GOLDEN BOY</p>
  </header>
  <div class="bezel">
    <div class="screen">
      <canvas id="game" width="480" height="270" tabindex="0" aria-label="Dr. Volt and the Golden Boy arcade game"></canvas>
      <div class="scan"></div>
    </div>
  </div>
  <div class="deck">
    <div class="pad" id="pad">
      <div>
        <button class="b" id="btn-left" data-k="left" aria-label="Move left">&#9664;</button>
        <button class="b" id="btn-right" data-k="right" aria-label="Move right">&#9654;</button>
      </div>
      <div>
        <button class="b storm" id="btn-storm" data-k="storm">STORM</button>
        <button class="b zap" id="btn-zap" data-k="fire">ZAP</button>
        <button class="b jump" id="btn-jump" data-k="jump">JUMP</button>
      </div>
    </div>
    <div class="row">
      <dl class="keys">
        <div><dt>&larr; &rarr;</dt><dd>move</dd></div>
        <div><dt>Space</dt><dd>jump</dd></div>
        <div><dt>Z</dt><dd>zap</dd></div>
        <div><dt>X</dt><dd>storm, when the meter is full</dd></div>
        <div><dt>P</dt><dd>pause</dd></div>
        <div><dt>M</dt><dd>sound</dd></div>
      </dl>
      <div style="display:flex;gap:10px">
        <button class="s" id="btn-start">START</button>
        <button class="s" id="btn-sound">SOUND ON</button>
      </div>
    </div>
    <details class="guide">
      <summary>MODES, POWER-UPS &amp; THE STORM</summary>
      <div class="guide-body" id="guide-body"></div>
    </details>
  </div>
</main>

<script>

const PUP={cell:1,coil:1,bike:1,field:1,watch:1,seeker:1,battery:1};

let MODE=MODES.find(m=>m.id===store.get('dv_mode','normal'))||MODES[1],sel=MODES.indexOf(MODE),tapPick=-1,titleT=0;

(()=>{const gb=document.getElementById('guide-body');if(!gb)return;
  const sec=(t,c,items)=>{const s=document.createElement('section'),h=document.createElement('h3');h.textContent=t;h.style.color=c;s.appendChild(h);const u=document.createElement('ul');
    items.forEach(it=>{const li=document.createElement('li');if(Array.isArray(it)){const b=document.createElement('b');b.textContent=it[0];li.appendChild(b);li.appendChild(document.createTextNode(' - '+it[1]))}else li.textContent=it;u.appendChild(li)});s.appendChild(u);gb.appendChild(s)};

  sec('THE STORM','#ff3d8b',['FILL THE METER BY FREEING CITIZENS, ZAPPING ENEMIES, HITTING BOSSES AND GRABBING STORM BATTERIES','WHEN IT FLASHES, PRESS X (OR THE STORM BUTTON)','EVERY ENEMY ON SCREEN IS BLASTED AND EVERY ENEMY SHOT IS WIPED OUT','BOSSES ARE STUNNED AND LOSE A BIG CHUNK OF ENERGY - EVEN THE VAULT WITH ITS DOOR SHUT']);
})();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hash=n=>{n=Math.imul(n^0x9e3779b9,0x85ebca6b);n^=n>>>13;n=Math.imul(n,0xc2b2ae35);return((n^n>>>16)>>>0)/4294967296};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const C={volt:'#35e0ff',bolt:'#ffe14a',gold:'#ffc83d',dgold:'#b8791a',hot:'#ff3d8b',ink:'#e9ecff',dim:'#8a86b5',dark:'#14142a'};

/* ---------- character rigs (drawn from parts, so limbs animate) ---------- */
let WH=false;                                   /* white hit-flash */
const col=c=>WH?'#fff':c;

function poly(c,pts){g.fillStyle=col(c);g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.fill()}
function limb(px,py,ang,len,wid,c,c2,end){

  if(end)R(-wid/2-.4,len-3,wid+2.6,3.4,end);g.restore();
}
const SKIN='#f2c29b',SKIND='#d59f78';
const VOLT={skin:SKIN,skinD:SKIND,hair:'#aab0c4',hairD:'#80869c',strap:'#2a2f4a',gog:'#35e0ff',mouth:'#8a5a48',coat:'#f3f6ff',coatD:'#b9c2e0',suit:'#2a6cff',em:'#ffe14a',leg:'#2456d6',legD:'#18409f',boot:'#23263f',tails:true,hand:SKIN};

/* hero box: 16 wide, 40 tall, faces right */
function hero(x,y,face,sc,pal,o){

  const ph=o.ph||0,sw=o.air?.95:o.run?Math.sin(ph)*.85:0,sw2=o.air?-.7:-sw,bob=o.run?Math.abs(Math.cos(ph))*1.2:0;

  const flut=(o.run||o.air?5:0)+Math.sin(tick/6)*1.5;

  g.fillStyle=col(pal.hair);g.beginPath();g.moveTo(3.2,6.5);g.quadraticCurveTo(2.2,-.4,8,.2);g.quadraticCurveTo(13.8,-.2,13.3,4.2);g.lineTo(11,3.3);g.lineTo(6.2,3.5);g.lineTo(5.3,8);g.lineTo(3.4,8.4);g.fill();

/* drone box: 26 wide, 16 tall */

const charge=n=>{P.storm=Math.min(100,P.storm+n)};

  P.hp--;P.inv=MODE.inv;P.vy=-4;SFX.hurt();shake=6;burst(P.x+8,P.y+20,C.volt,10);

}

function dmg(e,n,pierce){
  if(e.dead||bossDie>0)return;
  if(e.shut&&!pierce){if(tick%6===0)pop(e.x-8,e.y-10,'CLANG',C.dim);return}
  e.hp-=n;e.flash=5;SFX.hit();
  if(e.hp>0)return;
  if(e.boss){e.hp=0;bossDie=e.k==='gold'?170:110;ebul.length=0;add(e.pts);SFX.boom();if(e.k==='gold'){e.st='down'}}
  else{e.dead=true;add(e.pts);pop(e.x,e.y-8,''+e.pts*MODE.mult,C.bolt);burst(e.x+e.w/2,e.y+e.h/2,C.gold,16);SFX.boom();charge(7*MODE.gain);
    const r=Math.random(),dy=Math.min(e.y,GY-18);
    if(r<MODE.drop)ens.push(mkE('cell',e.x+3,dy));else if(r<MODE.drop+MODE.batDrop)ens.push(mkE('battery',e.x+3,dy))}
}
function storm(){
  P.storm=0;flashT=24;shake=10;SFX.storm();stormHits=[];ebul.length=0;
  for(const e of ens.slice()){const sx=e.x-camX;if(sx<-20||sx>W+20||e.dead)continue;
    if(e.k==='cit'){if(!e.freed){stormHits.push({x:e.x+6,y:e.y});free(e)}}
    else if(e.boss){if(bossDie>0)continue;stormHits.push({x:e.x+e.w/2,y:e.y});
      const d=Math.max(6,Math.ceil(e.max*MODE.stormDmg));dmg(e,d,true);
      if(bossDie===0){e.stun=MODE.stun;pop(e.x+e.w/2-28,Math.max(30,e.y-14),'STUNNED!',C.bolt)}}
    else if(isFoe(e)){stormHits.push({x:e.x+e.w/2,y:e.y});dmg(e,6,true)}}
}
function arenaDrops(){

  dropT=0;dropN++;

  const d=mkE(k,x,y);d.drop=1;d.life=600;ens.push(d);burst(x+7,y+7,k==='cell'?C.volt:C.hot,14);

function updPlayer(){
  const p=P;
  if(p.dead>0){p.dead--;if(p.dead===0){lives--;if(lives<0){state='over';overT=600;saveHi()}else{p.x=Math.max(safe.x,camX+4);p.y=safe.y;p.vy=0;p.hp=MODE.hp;p.inv=130}}return}
  if(p.inv>0)p.inv--;if(p.cool>0)p.cool--;if(p.power>0)p.power--;if(p.bike>0)p.bike--;if(p.field>0)p.field--;if(p.slow>0)p.slow--;if(p.seek>0)p.seek--;
  const ax=(K.right?1:0)-(K.left?1:0),sp=p.bike>0?4:2.2;
  p.vx=ax*sp;if(ax)p.face=ax;
  if(p.ground)p.coy=7;else if(p.coy>0)p.coy--;
  if(JP.jump&&p.coy>0){p.vy=-8;p.coy=0;p.ground=false;SFX.jump()}
  if(!K.jump&&p.vy<-3.2)p.vy=-3.2;
  p.vy=Math.min(9,p.vy+.42);
  p.x+=p.vx+windV;
  p.x=clamp(p.x,camX,(bossOn?arenaX+W:L)-p.w);
  for(const s of solids){if(overlap(p,s)&&p.y+p.h>s.y+4){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w}}
  const pb=p.y+p.h;p.y+=p.vy;p.ground=false;
  if(p.vy>=0){
    for(let i=0;i<solids.length+plats.length;i++){const q=i<solids.length?solids[i]:plats[i-solids.length];
      if(p.x+p.w>q.x&&p.x<q.x+q.w&&pb<=q.y+.01&&p.y+p.h>=q.y){p.y=q.y-p.h;p.vy=0;p.ground=true;
        if(i<solids.length&&p.x>q.x+10&&p.x+p.w<q.x+q.w-10)safe={x:p.x,y:p.y}}}
  }
  if(p.y>H+30){SFX.hurt();if(MODE.pitKills){pop(camX+W/2-56,H-40,'NO MERCY!',C.hot);die()}else{p.hp--;if(p.hp<=0){die()}else{p.x=Math.max(safe.x,camX+4);p.y=safe.y;p.vy=0;p.inv=100}}}
  if(K.fire&&p.cool<=0){
    const bx=p.face>0?p.x+p.w+2:p.x-16,by=p.y+14,sk=p.seek>0;
    bolts.push({x:bx,y:by,vx:p.face*7,vy:0,w:14,h:4,life:70,seek:sk});
    if(p.power>0){bolts.push({x:bx,y:by,vx:p.face*6.8,vy:-1.3,w:14,h:4,life:70,seek:sk},{x:bx,y:by,vx:p.face*6.8,vy:1.3,w:14,h:4,life:70,seek:sk})}
    p.cool=p.power>0?9:12;SFX.zap();
  }
  if(JP.storm&&p.storm>=100)storm();
}

}
